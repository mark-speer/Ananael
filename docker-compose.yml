services:
  mongo:
    image: mongo:latest
    container_name: ananael-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # Port exposed only on the Compose network by default; publish if you need host access
    expose:
      - "27017"
    networks:
      - ananael-net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ananael-server
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: "5000"
      MONGO_URI: mongodb://mongo:27017/ananael
      JWT_SECRET: ${JWT_SECRET:-ananael-dev-change-me-in-production}
      # Browser origin of the Nginx UI (set to http://<vm-ip>:8080 in Portainer if needed)
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
    ports:
      - "5000:5000"
    networks:
      - ananael-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ananael-client
    restart: unless-stopped
    depends_on:
      - server
    # 8080 avoids clashes with Portainer / other services already bound to host :80
    ports:
      - "8080:80"
    networks:
      - ananael-net

volumes:
  mongo_data:

networks:
  ananael-net:
    driver: bridge
