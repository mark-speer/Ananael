services:
  mongo:
    image: mongo:latest
    container_name: ananael-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # Port exposed only on the Compose network by default; publish if you need host access
    expose:
      - "27017"
    networks:
      - ananael-net

  # Single public entry: React UI + /api on host port 443
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: ananael-server
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: "443"
      MONGO_URI: mongodb://mongo:27017/ananael
      # Required: at least 32 characters. Example: openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a random string of at least 32 characters}
      # Public browser origin(s). Same-origin Compose: https://localhost (or your host URL).
      # Do not use * in production with cookie auth.
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-https://localhost}
      # Set true when serving over HTTPS (default for :443 Compose).
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Optional TLS — mount certs and point these at the files inside the container.
      SSL_CERT_PATH: ${SSL_CERT_PATH:-/certs/fullchain.pem}
      SSL_KEY_PATH: ${SSL_KEY_PATH:-/certs/privkey.pem}
    ports:
      - "443:443"
    volumes:
      # Place fullchain.pem + privkey.pem here (or set SSL_CERT_DIR).
      - ${SSL_CERT_DIR:-./certs}:/certs:ro
    networks:
      - ananael-net

volumes:
  mongo_data:

networks:
  ananael-net:
    driver: bridge
