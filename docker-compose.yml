services:
  mongo:
    image: mongo:latest
    container_name: ananael-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # Port exposed only on the Compose network by default; publish if you need host access
    expose:
      - "27017"
    networks:
      - ananael-net

  # Single public entry: React UI + /api on host port 5000
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: ananael-server
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: "5000"
      MONGO_URI: mongodb://mongo:27017/ananael
      JWT_SECRET: ${JWT_SECRET:-ananael-dev-change-me-in-production}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-*}
    ports:
      - "5000:5000"
    networks:
      - ananael-net

volumes:
  mongo_data:

networks:
  ananael-net:
    driver: bridge
